<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Limitless AI</title>
<style>
:root { --bg:#ffffff; --text:#1b1530; --muted:#5d5575; --line:#e7e3f0; --accent:#6a2ff0; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#07050d; --text:#f4f1fb; --muted:#a79fcb; --line:#241d38; --accent:#a85cff; }
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text);
  font:16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
main { max-width:720px; margin:0 auto; padding:48px 16px 64px; }
header { border-bottom:1px solid var(--line); padding-bottom:20px; margin-bottom:28px; }
.brand { font-weight:700; color:var(--accent); text-decoration:none; font-size:15px; }
h1 { font-size:32px; line-height:1.2; margin:14px 0 6px; }
.updated { color:var(--muted); font-size:14px; margin:0; }
h2 { font-size:19px; margin:32px 0 8px; }
p, li { color:var(--muted); }
ul { padding-left:22px; }
li { margin:6px 0; }
a { color:var(--accent); }
nav { margin-top:40px; padding-top:20px; border-top:1px solid var(--line); font-size:14px; }
nav a { margin-right:18px; }
</style>
</head>
<body>
<main>
<header>
<h1>Limitless AI</h1>
<p class="updated">Unlimited AI images, made on your iPhone.</p>
</header>
<p><a href="terms.html">Terms of Use</a></p>
<p><a href="privacy.html">Privacy Policy</a></p>
<p>Support and reports: <a href="mailto:supportappleap@gmail.com">supportappleap@gmail.com</a></p>
</main>
</body>
</html>
